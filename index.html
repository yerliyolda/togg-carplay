<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Togg CarPlay</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav id="dock">
  <button data-app="home" class="active" title="Ana ekran">⌂</button>
  <button data-app="map" title="Harita">🧭</button>
  <button data-app="speed" title="Hız">⏱</button>
  <button data-app="weather" title="Hava">⛅</button>
  <button data-app="media" title="Medya">▶</button>
  <button data-app="pair" title="Telefon" id="pairBtn">📱<i id="dot"></i></button>
</nav>
<main>
  <section id="home" class="app active">
    <div class="clock"><div id="time">--:--</div><div id="date"></div></div>
    <div class="grid">
      <button data-app="map"><span>🧭</span>Harita</button>
      <button data-app="speed"><span>⏱</span>Hız</button>
      <button data-app="weather"><span>⛅</span>Hava <small id="wTile"></small></button>
      <button data-app="media"><span>▶</span>Medya</button>
      <button data-app="pair"><span>📱</span>Telefon <small id="pTile">Bağlı değil</small></button>
      <button id="fsBtn"><span>⛶</span>Tam ekran</button>
    </div>
  </section>

  <section id="map" class="app">
    <div id="mapEl"></div>
    <div id="search"><input id="q" placeholder="Hedef ara…" enterkeyhint="search"><button id="go">Ara</button></div>
    <div id="results"></div>
    <div id="nav" hidden><div id="step"></div><div id="eta"></div><button id="stop">Bitir</button></div>
    <button id="recenter">◎</button>
  </section>

  <section id="speed" class="app">
    <div class="big"><span id="kmh">0</span><small>km/sa</small></div>
    <div class="sub"><span id="head">—</span><span id="acc"></span></div>
  </section>

  <section id="weather" class="app">
    <div id="wBody">Konum bekleniyor…</div>
  </section>

  <section id="media" class="app">
    <div id="mediaEmpty">Telefonundan bir YouTube bağlantısı gönder.</div>
    <iframe id="player" allow="autoplay; encrypted-media; fullscreen" allowfullscreen hidden></iframe>
  </section>

  <section id="pair" class="app">
    <div id="qrBox">
      <img id="qr" alt="QR">
      <div>
        <h2 id="pStatus">Telefonunu eşleştir</h2>
        <p>iPhone kameranla karekodu okut, açılan sayfada <b>Bağlan</b>'a dokun.</p>
        <button id="newSess">Yeni karekod</button>
      </div>
    </div>
  </section>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="car.js"></script>
</body>
</html>
